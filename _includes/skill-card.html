{% assign s=include.skill %}{% capture txt %}{{ s.name }} {{ s.summary }}{% endcapture %}
<article class="sms-skill-card" data-skill-card data-skill-category="{{ include.group_id }}" data-skill-search-text="{{ txt | downcase | escape }}"><a href="{{ s.detail_url | relative_url }}"><div class="sms-skill-icon" style="--accent:{{ s.accent }}"><i class="{{ s.icon }}"></i></div><div><h4>{{ s.name }}</h4><p>{{ s.summary }}</p><div class="sms-badges">{% if s.has_certificate %}<span><i class="fas fa-certificate"></i> Certificate</span>{% endif %}{% if s.has_samples %}<span><i class="fas fa-image"></i> Sample work</span>{% endif %}</div></div><i class="fas fa-arrow-right"></i></a></article>
