# ================================================================
# PUBLICATIONS DATA FILE
# ================================================================
# Edit this file to add, remove, or rearrange publications.
# Keep two spaces before the lines under "links:" and "keywords:".
# Put text containing a colon (:) inside quotation marks.
# Newest publications should normally be placed first.
#
# Fields you can use:
#   title       Required. Publication title.
#   authors     Required. All authors in the order shown by the paper.
#   highlight   Optional. Your name; it will be shown in bold.
#   venue       Required. Journal, conference, or repository name.
#   year        Required. Four-digit year.
#   type        Required. Used by the filter buttons.
#   status      Optional. Published, Accepted, Under Review, etc.
#   featured    Optional. true adds a Featured label.
#   image       Optional. Path to a thumbnail in /images/publications/.
#   summary     Optional. One short description of the work.
#   keywords    Optional. A list of short research keywords.
#   links       Optional. Add only the links you have.
#
# For another publication, copy one complete entry beginning with "- title:"
# and paste it below the previous entry.

