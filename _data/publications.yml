    slides: ""

- title: "Numerical Simulation of Cyclic Behavior of Cold-Formed Stainless-steel RHS Columns Subject to Cyclic Bending"
  authors: "Sakib, S.M. & Amanat, K.M."
  highlight: #"Shahriare Mahmud Sakib"
  venue: "International Conference on Civil Engineering Research and Innovations-ICCEI 2025"
  year: 2025
  type: "Conference Paper"
  status: "Presented"
  featured: true
  image: "/images/publications/conference-paper-iccei-2025.jpeg"
  summary: "A validated three-dimensional nonlinear finite element model was developed to investigate the seismic behavior of cold-formed stainless-steel RHS columns under cyclic bending. The model was verified against experimental results and successfully captured the hysteretic response and local buckling behavior, providing valuable insights into the seismic performance of these structural members and supporting the development of improved design approaches."
  keywords:
    - "Cold-Formed"
    - "Stainless-steel"
    - "Cyclic Bending"
    - "Hysteretic responses"
  links: "https://icceiruet.org/iccei-2025-2/"
