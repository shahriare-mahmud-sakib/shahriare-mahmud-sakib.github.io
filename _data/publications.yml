    doi: ""
    code: ""
    slides: ""
    bibtex: ""

- title: "Experimental and Numerical Investigation of ECC-jacketed Concrete-filled Steel Tube Columns under Seismic Loading using Shake Table"
  authors: "Sakib, S.M. & Joy, J.A."
  highlight: #"Shahriare Mahmud Sakib"
  venue: "International Conference on Civil Engineering-ICCE 2026"
  year: 2026
  type: "Conference Paper"
  status: "Abstract Accepted"
  featured: true
  image: "/images/publications/conference-paper-icce-2026.jpg"
  summary: "This paper investigates the seismic performance of ECC-jacketed concrete-filled steel tube (CFST) columns through shake table experiments and validated three-dimensional finite element modeling. The results show that ECC confinement improves the dynamic response and seismic resilience of CFST columns while providing a reliable basis for advanced numerical modeling and design of composite structural systems."
  keywords:
    - "Shake Table Test"
    - "ECC"
    - "CFST Column"
    - "Finite Element Analysis"
