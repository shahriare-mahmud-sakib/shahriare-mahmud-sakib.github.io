# =============================================================================
# EDITABLE CV PAGE SETTINGS
# Normally, this is the only file you need to edit.
# Keep the indentation exactly as shown and use spaces, not tabs.
# =============================================================================

pdf:
  # Put your PDF at this exact repository location:
  # files/cv/Shahriare_Mahmud_Sakib_CV.pdf
  path: "/files/cv/Shahriare_Mahmud_Sakib_CV.pdf"

  # Text used by browsers and screen readers.
  title: "Shahriare Mahmud Sakib - Curriculum Vitae"

viewer:
  # true = show the embedded CV; false = show only the download sentence.
  show: true

  # ---------------------------------------------------------------------------
  # EDIT THE VIEWER WIDTH HERE
  # ---------------------------------------------------------------------------
  # 100% makes the CV occupy the full content width beside the sidebar.
  width: "100%"

  # "none" means there is no additional maximum-width restriction.
  # Example alternative: "1100px"
  max_width: "none"

  # ---------------------------------------------------------------------------
  # EDIT THE VIEWER HEIGHT HERE
  # ---------------------------------------------------------------------------
  # Recommended desktop/laptop height:
  desktop_height: "680px"

  # Recommended phone/tablet height:
  mobile_height: "560px"

  # FitH asks Chrome/Edge PDF viewers to fit the document horizontally.
  fragment: "#view=FitH&toolbar=1&navpanes=0&scrollbar=1"

appearance:
  # Background visible while the PDF is loading.
  background: "#525659"

  # Use "0px" for square corners, as in the reference website.
  border_radius: "0px"

  # Use "0px" for no border or "1px" for a thin border.
  border_width: "1px"

download:
  # true = show the sentence below the embedded CV.
  show: true

  before: "You can download a PDF copy of my CV"
  link_text: "here"
  after: "."

  # false opens the PDF normally; true requests a direct download.
  force_download: false
