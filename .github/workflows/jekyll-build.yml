name: Validate Jekyll website

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jekyll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate YAML, routes, and Jekyll build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Validate YAML and page front matter
        run: ruby scripts/check_site.rb

      - name: Build the complete Jekyll website
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
