# =============================================================================
# SIDEBAR PROFILE, ICONS, TEXT, AND LINKS
# =============================================================================
# EDIT THIS FILE when you want to change:
#   1. your photo, name, or role;
#   2. the icon beside a sidebar item;
#   3. the wording beside an icon;
#   4. the icon color;
#   5. the destination link;
#   6. whether an item is visible.
#
# IMPORTANT:
# The SIZE of the icons and text is controlled in:
#   _sass/custom/_compact-sidebar-footer.scss
# Look for the large section named "EDITABLE SIZE CONTROLS" at the top.
# =============================================================================

profile:
  # Put the image inside the repository's /images/ folder.
  avatar: "/images/profile.jpg"
  name: "Shahriare Mahmud Sakib"
  role: "Lecturer, Department of Civil Engineering"
  follow_button: "Contact & Profiles"

# Keep the list reasonably short because the desktop sidebar is fixed and does
# not have its own scrollbar.
