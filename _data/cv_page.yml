# ================================================================
# EDIT THIS FILE TO CHANGE YOUR CV PAGE
# ================================================================
#
# Normally, this is the only code/settings file you need to edit.
# Keep indentation unchanged and use spaces rather than Tab.

pdf:
  # Location of your CV PDF inside the repository.
  path: "/files/cv/Shahriare_Mahmud_Sakib_CV.pdf"

  # Text used by screen readers and browsers.
  title: "Shahriare Mahmud Sakib - Curriculum Vitae"

viewer:
  # Set false to hide the embedded viewer and keep only the download sentence.
  show: true

  # ==============================================================
  # EDIT THESE VALUES TO CHANGE THE PDF VIEWER SIZE
  # ==============================================================
  # Desktop/laptop height in pixels:
  desktop_height: 650

  # Phone/tablet height in pixels:
  mobile_height: 560

  # Browser PDF-viewer options.
  # Chrome and Edge normally show the dark toolbar automatically.
  # Other browsers may display a different toolbar.
  fragment: "#view=FitH&toolbar=1&navpanes=0"

download:
  # Set false to hide the download sentence below the viewer.
  show: true

  # The sentence will be assembled as:
  # [before] [link_text][after]
  before: "You can download a PDF copy of my CV"
  link_text: "here"
  after: "."

  # Set true to request a direct download after clicking the link.
  # Set false to open the PDF normally in the browser.
  force_download: false
