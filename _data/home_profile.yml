page:
  eyebrow: "PROFILE"
  title: "About me"

  introduction:
    - >-
      I am a Civil Engineering graduate from the [Bangladesh University of 
      Engineering and Technology (BUET)](https://www.buet.ac.bd/web/#/), 
      currently working as a Lecturer in the Department of Civil Engineering 
      at [United International University (UIU)](https://www.uiu.ac.bd/).

    - >-
      My academic journey at BUET was marked by strong academic performance, 
      graduating with a CGPA of 3.89/4.00 and ranking among the top 10% of my 
      class. I specialized in Structural Engineering as my major and Transportation 
      Engineering as my minor.

    - >-
      My research interests include structural engineering, earthquake engineering, 
      structural dynamics, structural health monitoring, nonlinear numerical analysis, 
      and computational structural mechanics. My undergraduate research focused on 
      developing advanced nonlinear finite element models to investigate the structural 
      behavior of cold-formed stainless-steel columns under cyclic loading.

    - >-
      I am currently interested in integrating computational mechanics with experimental 
      investigations and data-driven techniques for structural performance assessment, 
      seismic resilience, and infrastructure health monitoring.

    - >-
      I am committed to pursuing advanced research that contributes to the development 
      of safer, smarter, and more resilient infrastructure systems through innovative 
      computational modeling, experimental research, and structural engineering applications.
      
