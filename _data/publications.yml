- title: "Nonlinear FE Investigation on Behavior of Cold-Formed Stainless-Steel Columns Subject to Cyclic Loading"
  authors: "Sakib, S.M. & Amanat, K.M."
  highlight: "Sakib, S.M."
  venue: "Thin-Walled Structures: Journal for Civil and Structural Engineering"
  year: 2026
  type: "Journal Article"
  status: "In preparation"
  featured: true
  image: "/images/publications/journal-article.jpg"
  summary: "This paper investigates the seismic behavior of cold-formed stainless-steel HSS columns under combined axial compression and cyclic bending using a validated three-dimensional nonlinear FE model developed in ANSYS. Parametric analyses reveal the effects of key geometric parameters on hysteretic response and local buckling, providing insights for improved seismic design of cold-formed stainless-steel columns."
  keywords:
    - "Cold-formed Steel Structures"
    - "Finite Element Analysis"
    - "Cyclic Loading"
    - "Stainless-steel"
