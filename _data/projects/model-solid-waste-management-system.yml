sections:
  - id: "overview"
    nav_label: "Overview"
    eyebrow: "PROJECT CONTEXT"
    heading: "Overview and motivation"
    paragraphs:
      - >-
        Rapid population growth and dense urban activity have placed substantial
        pressure on Dhaka's municipal solid-waste infrastructure. The capstone
        project proposed redevelopment and expansion of the existing Secondary
        Waste Transfer Station in Lalbag as a community-level solid-waste
        management system.

      - >-
        The proposal integrated segregated collection, improved transfer
        logistics, waste compaction, recovery and recycling, environmental
        safeguards, architectural planning, structural engineering, cost
        estimation, and phased implementation.

  - id: "my-contribution"
    nav_label: "My Contribution"
    eyebrow: "PERSONAL CONTRIBUTION"
    heading: "My role as team leader"
    paragraphs:
      - >-
        As team leader, I coordinated the overall project workflow and helped
        integrate the feasibility, architectural, structural, environmental,
        costing, and implementation components.

      - >-
        My technical contribution included developing the three-dimensional
        facility model in **Revit**, carrying out structural modelling and
        analysis in **SAP2000**, and preparing engineering drawings and details
        in **AutoCAD**.

  - id: "design"
    nav_label: "Engineering Design"
    eyebrow: "ARCHITECTURAL & STRUCTURAL ENGINEERING"
    heading: "Design development"
    paragraphs:
      - >-
        The final facility combined an office building with a larger transfer
        station. The office used an RCC-framed system, while the transfer
        station used an RCC structural system supporting a steel-truss roof.

