{% assign a=include.award %}
<article class="sms-award-item"><div class="sms-award-date">{{ a.period }}</div><div class="sms-award-dot" style="--accent:{{ a.accent }}"><i class="{{ a.icon }}"></i></div><a class="sms-award-card" href="{{ a.detail_url | relative_url }}"><div class="sms-award-card__top"><div><h3>{{ a.title }}</h3><p>{{ a.organization }}</p></div><i class="fas fa-arrow-up-right-from-square"></i></div><ul>{% for y in a.years %}<li>{{ y }}</li>{% endfor %}</ul><p>{{ a.summary }}</p><span>View certificate/details <i class="fas fa-arrow-right"></i></span></a></article>
