# =============================================================================
# PROJECTS PAGE SETTINGS
# Edit this file to change the page introduction, filters, and timeline heading.
# Edit individual projects inside the _portfolio folder.
# =============================================================================

page:
  eyebrow: "ACADEMIC & PROFESSIONAL PROJECTS"
  intro: >-
    A comprehensive overview of my academic and professional civil engineering projects/works 
    spanning sustainable infrastructure, structural analysis, computational methods, 
    engineering design, and programming.

timeline:
  show: true
  eyebrow: "PROJECT TIMELINE"
  heading: "Selected Projects"
  note: "Projects are arranged from newest to oldest."

controls:
  show_search: true
  search_placeholder: "Search projects, tools, methods, or topics..."
  show_filters: true
  filters:
    - label: "All"
      value: "all"
    - label: "Academic"
      value: "academic"
    - label: "Professional"
      value: "professional"
    # - label: "Research"
    #   value: "research"
    - label: "Programming"
      value: "programming"

empty_message: "No project matches the selected filter or search term."
