{% assign award = include.award %}

<article class="sms-award-item">
  <div class="sms-award-date">{{ award.period }}</div>

  <div
    class="sms-award-dot"
    style="--accent: {{ award.accent }};"
    aria-hidden="true"
  >
    <i class="{{ award.icon }}"></i>
  </div>

  <!-- Intentionally a DIV, not an anchor: awards are not hyperlinked. -->
  <div class="sms-award-card">
    <div class="sms-award-card__top">
      <div>
        <h3>{{ award.title }}</h3>
        <p>{{ award.organization }}</p>
      </div>
    </div>

    {% if award.years %}
      <ul>
        {% for year in award.years %}
          <li>{{ year }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <p>{{ award.summary }}</p>
  </div>
</article>
