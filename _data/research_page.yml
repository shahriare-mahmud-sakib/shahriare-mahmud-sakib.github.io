completed_research:
  heading: "Undergraduate Research"
  period: "Jan 2024 - Mar 2025"
  status: "Completed Research"
  status_icon: "fas fa-circle-check"

  title: >-
    Nonlinear FE Investigation on Behavior of Cold-Formed Stainless-Steel
    Columns Subject to Cyclic Loading

  supervisor:
    label: "Supervisor"
    name: "Dr. Khan Mahmud Amanat"
    url: "https://ce.buet.ac.bd/khan-mahmud-amanat/"
    designation: "Professor, Department of Civil Engineering, BUET"

  paragraphs:
    - >-
      My undergraduate research addressed the limited understanding of the
      seismic behavior of cold-formed stainless-steel hollow structural section
      (HSS) columns subjected to combined axial compression and cyclic bending.
      To investigate this problem, I developed a three-dimensional nonlinear
      finite element model using [ANSYS Mechanical
      APDL](https://www.ansys.com/blog/what-is-apdl), incorporating both
      geometric and material nonlinearities together with the effects of
      cold-forming.

    - >-
      The numerical model employed advanced constitutive material modeling
      through the [Chaboche nonlinear kinematic
      hardening](https://ansyshelp.ansys.com/public/account/secured?returnurl=/views/secured/corp/v251/en/wb_wbtec/WBteccurvefitchab.html)
      and [Voce isotropic
      hardening](https://ansyshelp.ansys.com/public/account/secured?returnurl=//views/secured/corp/v251/en/ans_mat/amp8sq21dldm.html)
      models and was rigorously validated against published experimental
      studies.

    - >-
      Following validation, an extensive parametric investigation involving 210
      nonlinear finite element simulations was conducted to evaluate the
      influence of geometric and loading parameters on the cyclic behavior and
      seismic performance of cold-formed stainless-steel columns.

    - >-
      This research strengthened my interest in computational structural
      mechanics and demonstrated the effectiveness of advanced nonlinear finite
      element modeling for evaluating the cyclic response, strength, ductility,
      and failure mechanisms of thin-walled steel structures subjected to
      seismic loading.

  tools_heading: "Tools and Techniques"

  tools:
    - >-
      Three-dimensional nonlinear finite element modeling (FEM) using [ANSYS
      Mechanical APDL](https://www.ansys.com/blog/what-is-apdl)

    - >-
      Nonlinear constitutive material modeling using [Chaboche kinematic
      hardening](https://ansyshelp.ansys.com/public/account/secured?returnurl=/views/secured/corp/v251/en/wb_wbtec/WBteccurvefitchab.html)
      and [Voce isotropic
      hardening](https://ansyshelp.ansys.com/public/account/secured?returnurl=//views/secured/corp/v251/en/ans_mat/amp8sq21dldm.html)
      models

    - "Geometric and material nonlinear analysis of thin-walled steel structures"

    - "Finite element model validation using published experimental data"

    - "Parametric analysis of cyclic structural behavior"

